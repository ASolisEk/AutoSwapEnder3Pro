[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoswap"
version = "0.2.0"
description = "App de escritorio (macOS/Windows) para el cambiador automatico de placas AutoSwapEnder3Pro"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Angel Solis Ek" }]
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=8", "ruff>=0.5"]
build = ["pyinstaller>=6.3"]

[project.scripts]
autoswap = "autoswap.cli:main"

[project.gui-scripts]
autoswap-gui = "autoswap.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
