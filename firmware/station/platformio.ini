; AutoSwapEnder3Pro - Firmware de la Estacion de Cambio Frontal (ECF)
; Arduino UNO R3 + CNC Shield V3 + 2 drivers (TMC2209 o A4988)
;
;   pio run -e uno                 compilar
;   pio run -e uno -t upload       cargar al Arduino (usa --upload-port si hay varios)
;   pio test -e native             pruebas de la logica en el ordenador (sin hardware)

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    waspinator/AccelStepper@^1.64
    arduino-libraries/Servo@^1.2.2
build_flags = -Wall

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -DUNIT_TEST_NATIVE
